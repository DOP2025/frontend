<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopSquare</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; padding: 0; }
      .container { max-width: 980px; margin: 24px auto; padding: 0 16px; }
      .row { display: grid; grid-template-columns: 1fr 360px; gap: 24px; }
      .card { border: 1px solid #e5e7eb; border-radius: 12px; padding: 16px; }
      .btn { padding: 8px 12px; border: 1px solid #111827; background: #111827; color: #fff; border-radius: 8px; cursor: pointer; }
      .btn:disabled { opacity: 0.6; cursor: not-allowed; }
      .muted { color: #6b7280 }
      .list { list-style: none; padding: 0; margin: 0; }
      .list li { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px dashed #e5e7eb; }
      .list li:last-child { border-bottom: none; }
      .right { text-align: right; }
      .input { width: 56px; padding: 4px 6px; border: 1px solid #d1d5db; border-radius: 6px; }
      header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
      code { background: #f3f4f6; padding: 2px 6px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
