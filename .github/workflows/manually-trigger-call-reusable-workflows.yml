name: CALL REUSABLE WORKFLOW

on:
  pull_request: 
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - '**.txt'
      - 'docs/**'
      - '.github/workflows/**'
    types: [opened, synchronize]
  workflow_dispatch: 

# Permission for GITHUB_TOKEN (Security Best Practice)  
permissions: 
  contents: read

env:
  TEST_ENV_VAR: 123456
  API_KEY: ${{secrets.API_KEY}}
  DOCKERHUB_USERNAME: ${{secrets.DOCKERHUB_USERNAME}}
  DOCKERHUB_PASSWORD: ${{secrets.DOCKERHUB_PASSWORD}}
  DOCKERHUB_REPO_NAME: dop2025.shopsquare.frontend
  SONAR_TOKEN: ${{secrets.SONAR_TOKEN}}
  SONAR_HOST_URL: ${{secrets.SONAR_HOST_URL}}

jobs: 
  code_quality_check:
    runs-on: dop10_self_hosted_runner_01 # ubuntu-latest
    strategy:
      fail-fast: false # if a job failed, another jobs still run and return a result.
    steps:
      # - name: demo reuseable workflow
        # uses: DOP2025/centralized-cicd-pipeline/.github/workflows/demo-workflows.yml@main

      - name: Checkout Repo
        uses: actions/checkout@v4
        # with:
        #   fetch-depth: 0 #! get all git history (neccessary for some analysis tools)
      
      # - name: Update OS
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y libatomic1 unzip 

      - name: Install Runtime
        uses: actions/setup-node@v6
        with:
          node-version: latest
          cache: 'npm'

      - name: Run Fail Test
        run: npm run fail

      # - name: Install dependencies
      #   run: npm install

      # - name: Check Code Format/Convention
      #   run: npm run lint

      - name: Run Test
        run: npm run test
      
      - name: Install Docker
        uses: docker/setup-docker-action@v4
      
      - name: Test Docker 
        run: echo "$(docker --version) || $(docker compose version)"
      
      - name: Analyze Source Code with SonarQube
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=shopsquare-frontend
            -Dsonar.projectName=shopsquare-frontend
            -Dsonar.sources=.
        

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_PASSWORD }}

      - name: Build and Push 
        uses: docker/build-push-action@v6
        with: 
          context:
          file: ./Dockerfile
          push: true
          tags: ${{env.DOCKERHUB_USERNAME}}/${{env.DOCKERHUB_REPO_NAME}}
      
      # - name: re-tag Docker Image 
      #   run: docker image tag 

      # - name: Push Docker Image to Docker Hub
      #   run: |
      #   # docker build -t ${{ secrets.DOCKERHUB_USERNAME }}.shopsquare.frontend:v1.0.0 .
      #   # docker login -u ${{ secrets.DOCKERHUB_USERNAME }}@gmail.com
      #   # docker push ${{ secrets.DOCKERHUB_USERNAME }}/dop2025.shopsquare.frontend:v1.0.0
