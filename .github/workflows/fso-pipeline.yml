jobs: 
  hello_world_job:
    runs-on: ubuntu-latest
    steps: 
      - name: Just say hello world
        run: |
          echo "Hello World!"
      - name: List of Files 
        run: ls -tla
      - name: Current Time
        run: echo "Current Time ${date}"
  
  tf_plan: 
    name: Terraform Plan
    runs-on: dop10_self_hosted_runner_01
    steps: 
      - name: Plan
        run: |
          echo "tf plan is executing now ..."
          echo "tf plan completed at ${date}"

  tf_apply:
    name: Terraform Apply
    needs: tf_plan
    runs-on: dop10_self_hosted_runner_01
    environment: dev
    steps: 
      - name: Apply
        run: |
          echo "tf apply is executing now ..."
          echo "tf apply completed at ${date}"
    
