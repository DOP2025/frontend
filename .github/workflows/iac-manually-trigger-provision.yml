name: IAC Manually Trigger Provision

on:
  workflow_dispatch:

permissions: 
  id-token: write
  contents: read
  pull-requests: write

env: 
  TF_VERSION: latest
  AWS_REGION: ap-northeast-2
  AWS_IAM_ID: ${{secrets.AWS_IAM_ID}}

jobs:
  # --- STEP 1: PLAN ---
  terraform-plan:
    name: Manually Trigger Plan
    runs-on: dop10_self_hosted_runner_01
    steps:
      - name: Update OS
        run: |
          sudo apt-get update
          sudo apt-get install -y libatomic1 unzip

      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{env.AWS_IAM_ID}}:role/GithubActionsDeployRole
          aws-region: ${{env.AWS_REGION}}
      
      - name: Install AWS CLI v2
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install --update

      - name: AWS Connection Check
        run: |
          aws --version
          aws s3 ls 
        # aws sts get-caller-identity

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{env.TF_VERSION}}
      
      - name: Terraform Version Check
        run: terraform version

      - name: Terraform Init
        run: |
          pwd
          cd .infra
          terraform init 
      
      - name: Terraform Format 
        run: |
          terraform fmt -check 
          terraform validate
      
      - name: Terraform Plan
        id: plan
        working-directory: .infra
        run: |
          pwd
          ls -tla
          terraform plan -no-color -detailed-exitcode -out=tfplan
        continue-on-error: true

      - name: Upload TF Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-artifact
          path: .infra/tfplan
          retention-days: 1

  # --- STEP 2: APPLY ---
  terraform-apply:
    name: Terraform Apply
    needs: terraform-plan
    runs-on: dop10_self_hosted_runner_01
    environment: dev
    steps:
      - name: Update OS
        run: |
          sudo apt-get update
          sudo apt-get install -y libatomic1 unzip
      
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{env.AWS_IAM_ID}}:role/GithubActionsDeployRole
          aws-region: ${{env.AWS_REGION}}

      - name: Install AWS CLI v2
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip awscliv2.zip
          sudo ./aws/install --update

      - name: AWS Connection Check
        run: |
          aws --version
          aws s3 ls 

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{env.TF_VERSION}}

      - name: Terraform Version Check
        run: terraform version

      - name: Terraform Init
        run: |
          pwd
          cd .infra
          terraform init -migrate-state
      
      - name: Terraform Format 
        run: |
          terraform fmt -check 
          terraform validate

      - name: Download TF Plan Artifact
        uses: actions/download-artifact@v4
        with: 
          name: tfplan-artifact
          path: .infra
          
      - name: Terraform Apply
        working-directory: .infra
        run: terraform apply -no-color tfplan